{% set name = "btrees" %}
{% set version = "6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4a7c703766847eb0fab58ae9b9d69cc80588cbfd6e34572bbabd4553e079fe2b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - persistent
  run:
    - python
    - persistent >=4.1.0
    - zope.interface >=5.0.0

test:
  imports:
    - BTrees
    - BTrees._base
    - BTrees._compat
    - BTrees.fsBTree
    - BTrees.IFBTree
    - BTrees.IIBTree
    - BTrees.Interfaces
    - BTrees.IOBTree
    - BTrees.IUBTree
    - BTrees.LFBTree
    - BTrees.LLBTree
    - BTrees.LOBTree
    - BTrees.LQBTree
    - BTrees.OIBTree
    - BTrees.OLBTree
    - BTrees.OOBTree
    - BTrees.OQBTree
    - BTrees.OUBTree
    - BTrees.QFBTree
    - BTrees.QLBTree
    - BTrees.QOBTree
    - BTrees.QQBTree
    - BTrees.UFBTree
    - BTrees.UIBTree
    - BTrees.UOBTree
    - BTrees.utils
    - BTrees.UUBTree
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs BTrees.tests
  requires:
    - pip
    - pytest
    - transaction

about:
  home: https://packages.python.org/BTrees
  license: ZPL-2.1
  license_family: Other
  license_file: LICENSE.txt
  summary: scalable persistent object containers
  description: |
    BTrees contains a set of persistent object containers built around a
    modified BTree data structure. The trees are optimized for use inside
    ZODB's "optimistic currency" paradigm, and include explicit resolution of
    conflicts detected by that mechanism.
  doc_url: https://pythonhosted.org/BTrees
  dev_url: https://github.com/zopefoundation/BTrees