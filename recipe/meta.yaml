{% set name = "BTrees" %}
{% set version = "6.2" %}
{% set sha256 = "4a7c703766847eb0fab58ae9b9d69cc80588cbfd6e34572bbabd4553e079fe2b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/B/BTrees/btrees-6.2.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  detect_binary_files_with_prefix: false

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - persistent
    - setuptools
    - wheel
  run:
    - python
    - persistent >=4.1.0
    - zope.interface >=5.0.0

test:
  imports:
    - BTrees
    - BTrees._IFBTree
    - BTrees._IIBTree
    - BTrees._IOBTree
    - BTrees._LFBTree
    - BTrees._LLBTree
    - BTrees._LOBTree
    - BTrees._OIBTree
    - BTrees._OLBTree
    - BTrees._OOBTree
    - BTrees._fsBTree

about:
  home: http://packages.python.org/BTrees
  license: ZPL 2.1
  license_family: Other
  license_file: LICENSE.txt
  summary: scalable persistent object containers
  description: |
    BTrees contains a set of persistent object containers built around a
    modified BTree data structure. The trees are optimized for use inside
    ZODB's "optimistic currency" paradigm, and include explicit resolution of
    conflicts detected by that mechanism.
  doc_url: http://pythonhosted.org/BTrees
  doc_source_url: https://github.com/zopefoundation/BTrees/blob/master/docs/index.rst
  dev_url: https://github.com/zopefoundation/BTrees
